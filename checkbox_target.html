<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Target</title>

</head>

<body>
    <table>
        <tr>
            <td>NAME:</td>
            <td><input type="text" id="inp1"></td>
        </tr>
        <tr>
            <td>ADDRESS:</td>
            <td><textarea name="" id="text1"></textarea></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="checkbox" id="check" onclick="Demo()">Above data is same for below</td>
        </tr>
        <tr>
            <td>NAME:</td>
            <td><input type="text" id="inp2"></td>
        </tr>
        <tr>
            <td>ADDRESS:</td>
            <td><textarea name="" id="text2"></textarea></td>
        </tr>
    </table>

    <script>
        function Demo() {
            let inp = document.querySelector("#inp1").value
            let text = document.querySelector("#text1").value
            document.querySelector("#inp2").value = inp
            document.querySelector("#text2").value = text
        }
    </script>
</body>

</html>
